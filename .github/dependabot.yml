version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Group all npm updates into one PR so peer-dep conflicts are visible
    # together rather than landing as separate merges that break each other.
    groups:
      npm-all:
        patterns:
          - "*"
